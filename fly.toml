# Ambient API — Fly.io configuration
# Region: iad (US-East, Ashburn) — single region for beta
# Ref: PLANS/AMBIENT_INFRA_PLAN_V1.md

app = "ambient-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # WAL volume mount path — must match Fly named volume mount destination
  WAL_DIR = "/data/wal"
  LOG_STORE_BUCKET = "ambient-logs"
  R2_REGION = "auto"
  # INSTANCE_ID is set per-machine at deploy time via fly secrets or machine env
  # API_BASE_URL: https://ambient-api.fly.dev/v1 (beta — custom domain deferred)

[http_service]
  internal_port = 8080
  force_https = true
  # Keep machines warm — never allow cold starts on the latency-sensitive hot path
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "10s"
    method = "GET"
    path = "/v1/ads/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent volume for WAL + dead-letter (Sentinel Decision 2)
# One ambient_wal volume per machine — provisioned via:
#   flyctl volumes create ambient_wal --region iad --size 1
# Fly assigns one volume per machine at first deploy.
[[mounts]]
  source = "ambient_wal"
  destination = "/data/wal"
